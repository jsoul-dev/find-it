<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>FindIt</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding" [fullscreen]="true">
  <div id="map"></div>

  @if (items().length === 0) {
    <p>No items yet.</p>
  } @else {
    <ion-list>
      @for (item of items(); track item.id) {
        <ion-item>
          <ion-label>
            <h2>{{ item.name }}</h2>
            <p>{{ item.description }}</p>
            <p>{{ item.contact }}</p>
          </ion-label>
          <ion-badge slot="end" [color]="item.type === 'Lost' ? 'danger' : 'success'">
            {{ item.type }}
          </ion-badge>
        </ion-item>
      }
    </ion-list>
  }
</ion-content>
