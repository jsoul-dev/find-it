<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>FindIt</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding" [fullscreen]="true">
  <div id="map"></div>

  @if (items().length === 0) {
    <p>No items yet.</p>
  } @else {
    @for (item of items(); track item.id) {
      <app-item-card [item]="item" (open)="goTo($event)" />
    }
  }
</ion-content>
